<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1814" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Banjo Chords" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Banjo Chords</title>
  </head>
  <body>
    <div id="app">
      <header class="controls">
        <label class="field">
          <span>Tuning</span>
          <select id="tuning"></select>
        </label>
        <button id="save-tuning" type="button" class="small-button">Save</button>
        <label class="field">
          <span>Key</span>
          <select id="key"></select>
        </label>
        <button id="clear" type="button" class="small-button">Clear</button>
      </header>

      <div id="string-heads" class="string-heads"></div>

      <main id="neck" class="neck-scroll" aria-label="Banjo neck. Tap a fret to place a finger."></main>

      <section id="panel" class="panel" aria-live="polite"></section>

      <!-- At the very bottom so the buttons never move as the chord panel changes size. -->
      <div class="play-bar">
        <button id="strum" type="button" class="play-button primary">▶ Strum</button>
        <button id="pick" type="button" class="play-button">Pick notes</button>
        <button id="tap-sound" type="button" class="play-button toggle" aria-pressed="true">Tap sound</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
